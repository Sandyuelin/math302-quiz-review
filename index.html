<script>
const QUIZZES = [{"id":"quiz1p3","week":1,"label":"1.3","title":"lecture1p2recap","topic":"Finite-precision arithmetic & cancellation","questions":[{"number":1,"question":"For x² + bx + 1 = 0 with b > 0 and |b| ≫ 1, which standard quadratic-formula root suffers cancellation?","options":["(−b − √(b² − 4))/2","(−b + √(b² − 4))/2","Neither","Both equally"],"type":"choice","sourcePage":1},{"number":2,"question":"How many numbers can be represented using 3 digits for base β=3?","options":[],"type":"input","sourcePage":1},{"number":3,"question":"For binary64, with 52 stored fraction bits and an implicit leading 1, what relative rounding-error bound was derived in the lecture?","options":["2⁻⁵²","2⁻⁵³","0.5 × 2⁻⁵³","10⁻⁵²"],"type":"choice","sourcePage":3},{"number":4,"question":"How many digits are there in the hexadecimal system?","options":[],"type":"input","sourcePage":3},{"number":5,"question":"In 4-digit rounding, p=0.54617 and q=0.54601. What does p ⊖ q become?","options":[],"type":"input","sourcePage":5},{"number":6,"question":"In fixed-point notation, the digit left of the decimal point always multiplies","options":["10⁻¹","10⁰","10¹","2"],"type":"choice","sourcePage":6},{"number":7,"question":"How many total bits does IEEE binary64 use?","options":[],"type":"input","sourcePage":6},{"number":8,"question":"Convert 10111_2 to decimal","options":[],"type":"input","sourcePage":8}]},{"id":"quiz1p4","week":1,"label":"1.4","title":"lecture1p3recap","topic":"IVT, bisection & fixed-point iteration","questions":[{"number":1,"question":"Suppose f is continuous on [a,b] and f(a)f(b)<0. What does the Intermediate Value Theorem guarantee?","options":["There is exactly one p∈(a,b) such that f(p)=0.","There is at least one p∈(a,b) such that f(p)=0.","The derivative f′ must vanish somewhere in (a,b).","The function must be monotone on [a,b]."],"type":"choice","sourcePage":1},{"number":2,"question":"Let Iₙ denote the intervals generated by the bisection method and |Iₙ| their length. What is |Iₙ₊₁|/|Iₙ|?","options":[],"type":"input","sourcePage":2},{"number":3,"question":"Which statement about the bisection error is emphasized in the lecture?","options":["The true error is equal to the interval-length bound.","The true error must decrease monotonically at every iteration.","The convergence bound is an upper bound, while the true error need not decrease monotonically.","Bisection can fail to converge even when the initial sign-change condition holds."],"type":"choice","sourcePage":3},{"number":4,"question":"Which condition is sufficient to guarantee convergence of pₙ₊₁ = g(pₙ) from any p₀ ∈ [a,b]?","options":["g is continuous on [a,b], with no bound on its derivative.","g′(x)≠0 for every x∈(a,b), together with g([a,b])⊆[a,b].","|g′(x)|≤1 for every x∈(a,b), with no condition on g([a,b]).","|g′(x)|≤L<1 for every x∈(a,b), together with g([a,b])⊆[a,b]."],"type":"choice","sourcePage":4},{"number":5,"question":"Suppose ∣g′(x)∣ ≤ 2 on an interval [a,b]. Give an upper bound for the Lipschitz constant.","options":[],"type":"input","sourcePage":5},{"number":6,"question":"The Lipschitz constant in the fixed-point theorem must be less than","options":[],"type":"input","sourcePage":6},{"number":7,"question":"Fill in the text with the correct function property: The Intermediate Value Theorem needs functions that are ____.","options":[],"type":"input","sourcePage":7}]},{"id":"quiz2p1","week":2,"label":"2.1","title":"lecture1p4recap_1","topic":"Fixed-point existence & Newton convergence","questions":[{"number":1,"question":"Which condition is the most general to guarantee the existence of a fixed point g(p)=p in an interval [a,b]","options":["g:[a,b] → [a,b]","g is continuous and g:[a,b] → [a,b]","g is Lipschitz continuous and g: [a,b] → [a,b]","g is Lipschitz continuous with constant L < 1 and g:[a,b] → [a,b]"],"type":"choice","sourcePage":1},{"number":2,"question":"Which of the following may be true? (Potentially more than one correct answer!)","options":["|g'(x)| > 1 for some x in [a,b] and the fixed-point iteration converges for some x_0 in [a,b]","A continuous function g maps [a,b] onto [a,b] and there is no fixed point of g in [a,b]","A function satisfies all assumptions of the fixed-point theorem but has no fixed point","A continuous function maps [1,2] to [1,5] and there is a fixed point in [1,2]"],"type":"multi","sourcePage":2}]},{"id":"quiz2p1_2","week":2,"label":"2.1 · Part 2","title":"lecture1p4recap_2","topic":"Newton convergence — part 2","questions":[{"number":1,"question":"Let g(p) = p. Which conditions are sufficient to have a quadratically convergent fixed-point iteration","options":["g'(p) exists and g''(p) = 0","g'(p) = 0 and g'' exists in a neighborhood around the fixed point","g'(p) = 0 and g'' is bounded in a neighborhood around the fixed point","both g' and g'' are bounded in a neighborhood around the fixed point"],"type":"choice","sourcePage":1},{"number":2,"question":"Let f(x) and w(x) be continuous functions, and let p be a real number. For which expressions is f(p) = 0 equivalent to g(p) = p? (Potentially more than one correct answer)","options":["g(x) = x - f(x)","g(x) = x - 5 f(x)","g(x) = x - w(x) f(x)","g(x) = x - w(x) f(x) and w(p) ≠ 0"],"type":"multi","sourcePage":2},{"number":3,"question":"let g(x) = x - f(x)/f'(x) be the Newton iteration function and let f(p) = 0. Which of the following is correct? (Potentially more than one correct answer.)","options":["g'(p) = 0 by construction","g''(p) < M by construction","if g''(x) < M for all x in [a,b], then Newton iteration converges for all x_0 in [a,b]","f(p)=0 is equivalent to g(p) = p, provided that f'(p) ≠0"],"type":"multi","sourcePage":3}]},{"id":"quiz2p1_1","week":2,"label":"2.1 · Part 1","title":"lecture1p4_inclass","topic":"Two-dimensional fixed points","questions":[{"number":1,"question":"Does the function displayed have a unique fixed point in [-1,1]^2","options":["yes","no","may or may not have a unique fixed point","cannot be answered with the information given"],"type":"choice","sourcePage":1}]},{"id":"quiz2p2","week":2,"label":"2.2","title":"lecture2p1recap","topic":"Fixed-point & Newton methods for systems","questions":[{"number":1,"question":"What is the main convergence condition in the fixed-point theorem for systems?","options":["||G(v) - G(u)||_∞ ≤ K ||v - u||_∞ with 0 ≤ K < 1","||G(v) - G(u)||_∞ ≤ K ||v - G(u)||_∞ with K > 1","||G(v) - G(u)||_∞ = ||v - u||_∞","G must be differentiable everywhere"],"type":"choice","sourcePage":1},{"number":2,"question":"What does the main fixed-point theorem for systems guarantee under its stated assumptions?","options":["Existence of a fixed point, but not uniqueness","A unique fixed point and convergence from any initial guess in considered domain D","D Quadratic convergence from any initial guess","A unique fixed point only for initial guesses sufficiently close to it"],"type":"choice","sourcePage":2},{"number":3,"question":"What derivative condition is given as a sufficient condition for the Lipschitz bound?","options":["|∂G_i/∂x_j| ≤ K or all i,j and all x in D","|∂G_i/∂x_j| ≤ nK for all i,j","|∂G_i/∂x_i| = K/n all i and all x in D","|∂G_i/∂x_j| ≤ K/n for all i,j and all x in D"],"type":"choice","sourcePage":3},{"number":4,"question":"Why does the derivative bound imply the Lipschitz condition?","options":["Because every differentiable function is automatically Lipschitz","The mean-value argument bounds each component by K times the infinity-norm distance","distance Because the Jacobian must be symmetric","Because D must be a cube"],"type":"choice","sourcePage":4},{"number":5,"question":"For a fixed-point iteration to converge quadratically near p, what must happen to the first derivatives of G at p?","options":["The Jacobian must equal the identity","All partial derivatives ∂g_i/ ∂x_j(p) must vanish","All second derivatives must vanish","The function G must be linear"],"type":"choice","sourcePage":5},{"number":6,"question":"For the system G(x) = x − B(x)F(x), when is a fixed point equivalent to a root of F?","options":["When B(p) is nonsingular","Only when B(p) is the identity","Only when F is linear","Whenever B is singular"],"type":"choice","sourcePage":6},{"number":7,"question":"Which equation is the Newton step for a system?","options":["J(x(k))Δx = F (x(k)), followed by x(k+1) = x(k) − Δx","F (x(k))Δx = J(x(k)), followed by x(k+1) = x(k) + Δx","J(x(k))x(k+1) = F (x(k))","x(k+1) = x(k) − F (x(k))"],"type":"choice","sourcePage":7},{"number":8,"question":"What does quadratic convergence of Newton's method mean locally?","options":["The error decreases by a fixed constant factor","The number of iterations is proportional to the square of n","The error is approximately proportional to the square of the previous error","The residual is exactly zero after two iterations"],"type":"choice","sourcePage":8}]},{"id":"quiz2p3","week":2,"label":"2.3","title":"lecture2p2recap","topic":"Broyden & steepest descent","questions":[{"number":1,"question":"What is the main motivation for Broyden's method?","options":["To guarantee global convergence","To avoid evaluating the function F","To avoid repeatedly computing the Jacobian matrix","To turn a system into a scalar equation"],"type":"choice","sourcePage":1},{"number":2,"question":"What condition motivates the Broyden secant update?","options":["A x(k) = F (x(k)) k","A Δx(k) = k ΔF (k)","A ΔF (k) = k Δx(k)","A = J(x(k+1)) k exactly"],"type":"choice","sourcePage":2},{"number":3,"question":"Why is the Broyden secant condition alone insufficient to determine A_k?","options":["it gives n equations for 1 unknown","It gives n equations for n^2 unknown entries","It gives n^2 equations for n unknowns","it gives n^2 equations for n^2 unknowns"],"type":"choice","sourcePage":3},{"number":4,"question":"In the least-change Broyden update, what happens in directions z orthogonal to Δx(k)?","options":["A z = A z k k−1","A z = 0 k","A z = J(x(k))z k","A z = ΔF (k) k"],"type":"choice","sourcePage":4},{"number":5,"question":"Let A be an n by n matrix and let a,b be vectors of length n. Which is a rank one update of A?","options":["A + ab","T A+ a b","T A + ab","T T A + a b"],"type":"choice","sourcePage":4},{"number":6,"question":"What does the Sherman–Morrison formula do?","options":["perform a rank-one matrix update efficiently","helps us avoid a rank-one matrix update","Update the inverse of a rank-one matrix update efficiently","eliminates the need to compute the inverse of a rank-one update"],"type":"choice","sourcePage":5},{"number":7,"question":"In the Broyden implementation, what does the matrix A represent after initialization?","options":["The identity matrix","The exact Jacobian","An approximation to the Jacobian","An approximation to the inverse Jacobian"],"type":"choice","sourcePage":6},{"number":8,"question":"For the reformulation g(x) = Σ_i f_i(x)^2, what is true at a root F(x)=0?","options":["g(x) can be negative","g(x)=1, which is a local minimum","g(x)=0, which is a global minimum","g(x) is necessarily a local maximum"],"type":"choice","sourcePage":7}]},{"id":"quiz2p4","week":2,"label":"2.4","title":"lecture2p3recap","topic":"Gaussian elimination","questions":[{"number":1,"question":"Suppose m_ij=a_ij/a_jj. What is the purpose of E_i ← E_i−m_ij E_j?","options":["To make a_ij=0.","To make a_jj=0.","To make a_ji=0.","To interchange rows i and j."],"type":"choice","sourcePage":1},{"number":2,"question":"Suppose a_jj=5 and a_ij=−10. Which row operation eliminates a_ij?","options":["E_i ← E_i − 2E_j","E_i ← E_i + 2E_j","E_i ← E_i − (1/2)E_j","E_i ← E_i + (1/2)E_j"],"type":"choice","sourcePage":2},{"number":3,"question":"Suppose Ux=y, where U is upper triangular with u_11=2, u_22=3, and u_33=4. Which equation is used first to determine x_3?","options":["2x_1+x_2−x_3=y_1","3x_2+2x_3=y_2","4x_3=y_3","x_1+x_2+x_3=y_1+y_2+y_3"],"type":"choice","sourcePage":2},{"number":4,"question":"Suppose during elimination we use E_i ← E_i − m_ij E_j. What must happen to the corresponding entries of the right-hand side?","options":["Nothing.","b_i ← b_i − m_ij b_j.","b_j ← b_j − m_ij b_i.","b_i ← m_ij b_i."],"type":"choice","sourcePage":3},{"number":5,"question":"For an n×n system, how many pivot columns require elimination below the diagonal?","options":["n","n−1","n+1","n^2"],"type":"choice","sourcePage":3},{"number":6,"question":"Consider A = [[0,1],[1,1]]. The first pivot is zero. Which statement is correct?","options":["A must be singular.","The system has no solution.","Gaussian elimination without row interchange breaks down, but A is nonsingular.","Gaussian elimination can proceed normally."],"type":"choice","sourcePage":4},{"number":7,"question":"Suppose matrices M_1 and M_2 represent two successive row elimination steps. Which expression represents applying M_1 first and then M_2 to A?","options":["M_1 M_2 A","M_2 M_1 A","A M_1 M_2","A(M_1+M_2)"],"type":"choice","sourcePage":5}]},{"id":"quiz3p1","week":3,"label":"3.1","title":"lecture2p4recap","topic":"Conditioning, LU & pivoting","questions":[{"number":1,"question":"Let ∣∣ ⋅ ∣∣ be a matrix norm.What is the definition of the condition number","options":["κ = ∣∣A∣∣","κ = ∣∣A−1∣∣","κ = ∣∣A∣∣∣∣A−1∣∣","κ = ∣∣A∣∣/∣∣A−1∣∣"],"type":"choice","sourcePage":1},{"number":2,"question":"What is the result of PA where A is a square matrix and P is a permutation matrix of the same size.","options":["The result is undefined","PA exchanges the rows of the matrix A","PA exchanges the columns of the matrix A","PA = A"],"type":"choice","sourcePage":2},{"number":3,"question":"Suppose A is an n by n matrix. If n is doubled, approximately by what factor does the dominant cost of LU factorization change?","options":["2","4","8","16"],"type":"choice","sourcePage":3},{"number":4,"question":"Suppose the entries in the active part of the pivot column are 2, −7, and 4. Which one is selected by partial pivoting?","options":["The entry −7.","The entry 2.","The entry 4.","Their sum."],"typ em.","The least-squares error is automatically zero.","The approximating polynomial always interpolates f at the endpoints.","The polynomial degree can be reduced without changing the approximation."],"type":"choice","sourcePage":2},{"number":3,"question":"Which statement about the extrema of Tₙ on [−1,1] is correct?","options":["Tₙ has exactly n extrema, all equal to zero","Tₙ has exactly n+1 extrema, with values alternating between 1 and −1","Tₙ has exactly 2n extrema, all of magnitude 2ⁿ⁻¹","Tₙ has extrema only at x=−1 and x=1"],"type":"choice","sourcePage":3},{"number":4,"question":"Why is T̃ₙ = 2⁻⁽ⁿ⁻¹⁾Tₙ introduced in the lecture for n ≥ 1?","options":["It is monic, so it can be compared with all other monic polynomials of degree n.","It is orthonormal with respect to the Chebyshev weight.","Its zeros become equally spaced on [−1, 1].","Its maximum absolute value on [−1, 1] becomes 1."],"type":"choice","sourcePage":4},{"number":5,"question":"What does the MinMax property of T̃ₙ state?","options":["It minimizes ∫₋₁¹|Pₙ(x)|dx among all polynomials of degree at most n","It minimizes ∫₋₁¹Pₙ(x)²dx among all monic polynomials of degree n","It uniquely minimizes max₋₁≤ₓ≤₁|Pₙ(x)| among monic polynomials of degree n","It uniquely minimizes max₋₁≤ₓ≤₁|P′ₙ(x)| among monic polynomials of degree n"],"type":"choice","sourcePage":4},{"number":6,"question":"To minimize ω(x) in the Lagrange interpolation error bound, which interpolation nodes should be chosen?","options":["The n+1 extrema of Tₙ","The n+1 zeros of Tₙ₊₁","The n+1 equally spaced points including −1 and 1","The n+1 zeros of Tₙ together with one endpoint"],"type":"choice","sourcePage":6},{"number":7,"question":"How are the zeros of Chebyshev polynomials distributed on [−1, 1]?","options":["They are equally spaced.","They are clustered near the center of the interval.","They occur only in the right half of the interval.","They are clustered near the endpoints of the interval."],"type":"choice","sourcePage":7}]},{"id":"quiz5p4_1","week":5,"label":"5.4 · Part 1","title":"lecture5p4pade","topic":"Padé [1/2] of arctan","questions":[{"number":1,"question":"In the pade [1/2] approximation of arctan(x), what is p_0","options":[],"type":"input","sourcePage":1},{"number":2,"question":"In the pade [1/2] approximation of arctan(x), what is p_1?","options":[],"type":"input","sourcePage":2}]},{"id":"quiz6p1","week":6,"label":"6.1","title":"lecture5p4recap","topic":"Padé & Fourier approximation","questions":[{"number":1,"question":"What feature can a rational function represent that no polynomial can have at a finite x value of?","options":["A local maximum","A vertical asymptote","A zero","A horizontal tangent"],"type":"choice","sourcePage":1},{"number":2,"question":"With q(0) = 1, how many free coefficients does a [2/3] Padé approximation have?","options":["5","7","8","6"],"type":"choice","sourcePage":2},{"number":3,"question":"A [2/1] Padé approximation matches derivatives through which order at the expansion point?","options":["2","4","3","1"],"type":"choice","sourcePage":2},{"number":4,"question":"What quantity does the classical Fourier approximation Sₙ minimize on [−π,π]?","options":["maxₓ∈[−π,π]|f(x)−Sₙ(x)|","∫₋π^π|f(x)−Sₙ(x)|dx","∫₋π^π(f(x)−Sₙ(x))²dx","(∫₋π^π(f(x)−Sₙ(x))dx)²"],"type":"choice","sourcePage":3},{"number":5,"question":"For f(x)=2+3cos(2x)−sin(3x) on [−π,π], what is its least-squares Fourier approximation S₂?","options":["2 + 3 cos(2x)","2 − sin(3x)","1 + 3 cos(2x)","2 + 3 cos(2x) − sin(3x)"],"type":"choice","sourcePage":4},{"number":6,"question":"Let Sₙ and Sₙ₊₁ be the best Fourier least-squares approximations to the same f. How do their integrated squared errors compare?","options":["Eₙ₊₁ > Eₙ always","Eₙ₊₁ ≤ Eₙ","Eₙ₊₁ < Eₙ always","Eₙ₊₁ = Eₙ always"],"type":"choice","sourcePage":5},{"number":7,"question":"For an odd function, which Fourier coefficients vanish on the lecture’s symmetric interval?","options":["Constant and cosine coefficients","Sine coefficients only","Constant coefficient only","All Fourier coefficients"],"type":"choice","sourcePage":6}]},{"id":"quiz6p2","week":6,"label":"6.2","title":"lecture6p1recap","topic":"Numerical differentiation & consistency","questions":[{"number":1,"question":"What does consistency mean for a finite-difference approximation?","options":["It is exact at every step size.","Its error vanishes as the step shrinks.","Its round-off error is always zero.","Its error is independent of step size."],"type":"choice","sourcePage":1},{"number":2,"question":"For smooth f, the leading error term in [f(x+h)−f(x)]/h − f′(x) is…","options":["constant","O(h)","O(h²)","O(h³)"],"type":"choice","sourcePage":2},{"number":3,"question":"Why is the central difference formula for the first derivative more accurate than forward difference?","options":["Symmetry cancels additional Taylor terms.","It uses a smaller denominator.","It eliminates every Taylor remainder.","It requires fewer function evaluations."],"type":"choice","sourcePage":3},{"number":4,"question":"Why can an extremely small step size worsen a finite-difference approximation?","options":["Taylor truncation error necessarily increases.","The formula becomes inconsistent in exact arithmetic.","Division by the step amplifies evaluation errors.","The derivative changes with the step size."],"type":"choice","sourcePage":4},{"number":5,"question":"What does Richardson extrapolation do to the leading truncation-error term?","options":["Cancels it by combining approximations.","Estimates it using the exact solution.","Retains it and cancels smaller terms.","Removes it by rounding each approximation."],"type":"choice","sourcePage":5},{"number":6,"question":"If M = N₁(h)+K₁h²+K₂h⁴+⋯, what error order does [4N₁(h/2)−N₁(h)]/3 achieve?","options":["O(h²)","O(h³)","O(h⁴)","O(h⁶)"],"type":"choice","sourcePage":6},{"number":7,"question":"Once the first column of a Richardson table is available, how are later columns computed?","options":["By evaluating the exact derivatives.","By linear combinations of existing approximations.","By fresh function evaluations in every cell.","By selecting the smallest existing approximation."],"type":"choice","sourcePage":7}]},{"id":"quiz6p3","week":6,"label":"6.3","title":"lecture6p2recap","topic":"Interpolatory & composite quadrature","questions":[{"number":1,"question":"How is an interpolatory quadrature rule constructed?","options":["Differentiate the interpolating polynomial.","Integrate the interpolating polynomial.","Integrate only the interpolation remainder.","Average the interpolation nodes."],"type":"choice","sourcePage":1},{"number":2,"question":"If the coefficients for integration on [0,n] are aᵢ, what are the coefficients for [a,b]?","options":["(b−a)aᵢ","(b−a)aᵢ/n","naᵢ/(b−a)","aᵢ/n"],"type":"choice","sourcePage":2},{"number":3,"question":"For f(x)=x² on [0,2], what is the midpoint integral approximation?","options":["2","3","4","8"],"type":"choice","sourcePage":2},{"number":4,"question":"A quadrature rule has degree of precision three. Which statement must hold?","options":["It integrates every cubic polynomial exactly.","It uses exactly three evaluation nodes.","It integrates every quartic polynomial exactly.","It gives three correct decimal places."],"type":"choice","sourcePage":3},{"number":5,"question":"What distinguishes open from closed Newton–Cotes rules?","options":["Open rules require unequally spaced nodes.","Open rules omit both endpoints.","Closed rules omit both endpoints.","Closed rules use only the midpoint."],"type":"choice","sourcePage":4},{"number":6,"question":"What is the central idea of composite numerical integration?","options":["Use only the original interval endpoints.","Fit one polynomial of increasing degree.","Average approximations without interval- length weights.","Sum quadrature approximations over smaller subintervals."],"type":"choice","sourcePage":5},{"number":7,"question":"how many function evaluations does Simpson's rule use?","options":[],"type":"input","sourcePage":5},{"number":8,"question":"How many function evaluations does composite trapezoidal integration use for n intervals?","options":["n","n+1","2n","2n-1"],"type":"choice","sourcePage":7}]},{"id":"quiz6p4","week":6,"label":"6.4","title":"lecture6p3recap","topic":"Romberg & Gaussian quadrature","questions":[{"number":1,"question":"In our example, Romberg starts with error O(h²). What is the error order after two extrapolation stages?","options":["O(h³)","O(h⁴)","O(h⁶)","O(h⁸)"],"type":"choice","sourcePage":1},{"number":2,"question":"How are Gauss–Legendre quadrature nodes selected on the reference interval?","options":["As equally spaced points including the endpoints.","As roots of the integrand.","As roots of the corresponding Legendre polynomial.","As roots of the corresponding Lagrange basis."],"type":"choice","sourcePage":2},{"number":3,"question":"Let Pₙ denote the Legendre polynomial of degree n. Then Pₙ is orthogonal to","options":["Pₘ with m<n, but not all polynomials of degree m<n","all polynomials of degree m<n","Pₘ with m≤n","all polynomials of degree m≤n"],"type":"choice","sourcePage":3},{"number":4,"question":"What is the degree of precision of the three-node Gauss–Legendre quadrature?","options":["3","4","5","6"],"type":"choice","sourcePage":4},{"number":5,"question":"Given P₂(x)=x²−1/3, which pair gives the two-node Gauss–Legendre nodes?","options":["−1/√3, 1/√3","−1/3, 1/3","−1, 1","−√3, √3"],"type":"choice","sourcePage":4},{"number":6,"question":"How are Gaussian quadrature weights obtained?","options":["By differentiating the Legendre polynomial at nodes.","By assigning equal weights to every node.","By integrating the corresponding Lagrange basis functions.","By evaluating the integrand at the nodes."],"type":"choice","sourcePage":5}]},{"id":"quiz7p1","week":7,"label":"7.1","title":"Lecture6p4recap","topic":"ODE theory, Lipschitz & Euler","questions":[{"number":1,"question":"On a convex domain, |∂f/∂y| ≤ 4 implies which inequality?","options":["|f(t,y₂) − f(t,y₁)| ≤ |y₂ − y₁|/4","|f(t,y₂) − f(t,y₁)| ≥ 4|y₂ − y₁|","|f(t,y₂) − f(t,y₁)| ≤ 4|t|","|f(t,y₂) − f(t,y₁)| ≤ 4|y₂ − y₁|"],"type":"choice","sourcePage":1},{"number":2,"question":"What is required for an ODE initial value problem to be well posed?","options":["Only existence of a solution","Only existence of a unique solution","Existence of a unique solution and stability","An explicit solution formula"],"type":"choice","sourcePage":2},{"number":3,"question":"Which identity follows by integrating y′ = f(t,y) over one step?","options":["y(t+h) = y(t) + ∫ₜᵗ⁺ʰ f(s,y(s)) ds","y(t+h) = ∫ₜᵗ⁺ʰ f(s,y(s)) ds","y(t+h) = y(t) + h∫ₜᵗ⁺ʰ f(s,y(s)) ds","y(t+h) = y(t) − ∫ₜᵗ⁺ʰ f(s,y(s)) ds"],"type":"choice","sourcePage":3},{"number":4,"question":"Which quadrature approximation produces the Euler update shown in the lecture?","options":["Trapezoidal rule","Midpoint rectangle rule","Right-endpoint rectangle rule","Left-endpoint rectangle rule"],"type":"choice","sourcePage":4},{"number":5,"question":"In Euler’s algorithm, a = 1, b = 3, and N = 8. What is h?","options":["0.25","0.5","4","0.125"],"type":"choice","sourcePage":4},{"number":6,"question":"For y′ = y, which expression is Euler’s update?","options":["yᵢ₊₁ = yᵢ + h","yᵢ₊₁ = yᵢ/(1−h)","yᵢ₊₁ = eʰyᵢ","yᵢ₊₁ = (1+h)yᵢ"],"type":"choice","sourcePage":5}]},{"id":"quiz7p2","week":7,"label":"7.2","title":"lecture7p1recap","topic":"Higher-order Taylor methods","questions":[{"number":1,"question":"Why do we seek alternatives to Euler’s method?","options":["Euler requires higher derivatives at every step","Euler cannot use prescribed initial data","Its low accuracy order is often insufficient","Its implementation is unusually complicated"],"type":"choice","sourcePage":1},{"number":2,"question":"In a Taylor method, how are f (k) derivatives interpreted?","options":["As partial derivatives in time","As partial derivatives with respect to the solution variable","As total time derivatives along the solution","As derivatives with respect to step size h"],"type":"choice","sourcePage":2},{"number":3,"question":"For y′=f(t,y) with f(t,y)=t+y, what is f′ along the solution?","options":["1","t+y","1+t+y","1+y"],"type":"choice","sourcePage":3},{"number":4,"question":"How does a Taylor method achieve higher consistency order?","options":["By repeating the same Euler slope","By changing the prescribed initial value","By discarding the step-size factor","By retaining more terms of the Taylor expansion"],"type":"choice","sourcePage":3},{"number":5,"question":"Which is the highest-order term in Φ for the third-order Taylor method?","options":["h³f″/6","h²f″/6","h²f″/2","hf′/2"],"type":"choice","sourcePage":4},{"number":6,"question":"In the convergence theorem, how must the Lipschitz constant for Φ behave as the step size decreases?","options":["It may grow without bound","It must approach zero","One constant must work for all sufficiently small steps","A different unbounded constant is allowed per step"],"type":"choice","sourcePage":5},{"number":7,"question":"Under the stated uniform Lipschitz assumption and exact initial data, what global-error order does the theorem guarantee?","options":["The same order as the consistency bound","One order lower than the consistency bound","One order higher than the consistency bound","First order regardless of consistency order"],"type":"choice","sourcePage":6}]},{"id":"quiz7p3","week":7,"label":"7.3","title":"lecture7p2recap","topic":"Runge–Kutta & embedded methods","questions":[{"number":1,"question":"What motivates Runge–Kutta methods as an alternative to higher-order Taylor methods?","options":["They avoid evaluating derivatives of the right-hand side","They require no right-hand-side evaluations","They eliminate all numerical error","They require no initial condition"],"type":"choice","sourcePage":1},{"number":2,"question":"Why is the direct trapezoidal update generally implicit?","options":["It uses the initial slope twice","It uses a midpoint prediction","It evaluates f(tᵢ₊₁,yᵢ₊₁) to find yᵢ₊₁","It changes the step size automatically"],"type":"choice","sourcePage":2},{"number":3,"question":"Which slope evaluation determines the full-step increment in the explicit midpoint scheme?","options":["The slope at the current point tᵢ","The slope at the right endpoint tᵢ₊₁","The average of both endpoint slopes","The slope at the predicted midpoint"],"type":"choice","sourcePage":3},{"number":4,"question":"For y′=y, yᵢ=1, and h=0.5, what is the midpoint predictor yᵢ₊₁⁄₂?","options":["1.25","1.5","1.125","0.25"],"type":"choice","sourcePage":4},{"number":5,"question":"What makes the successive-order schemes discussed in the lecture embedded?","options":["They use identical final weights","The lower-order method shares all its function evaluations","They both require exact endpoint values","They never change the step size"],"type":"choice","sourcePage":5},{"number":6,"question":"Why can the difference between two successive-order approximations estimate the lower-order truncation error?","options":["Both methods have identical errors","The higher-order method is exact","The higher-order truncation error is of smaller order","The difference equals the global error"],"type":"choice","sourcePage":6},{"number":7,"question":"In embedded RK schemes, what happens when the estimated error exceeds the tolerance?","options":["Advance time and keep the trial value","Repeat from the current point with a smaller step","Advance time but keep the current value","Accept the step and increase its size"],"type":"choice","sourcePage":7}]}];
const STORE_KEY = 'math302-wooclap-review-v1';
const byId = Object.fromEntries(QUIZZES.map(q => [q.id,q]));
const weeks = [...new Set(QUIZZES.map(q => q.week))];
let state = {week:1,quiz:QUIZZES[0].id,answers:{}};
try { state = {...state,...JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}; } catch(e) {}
if(!byId[state.quiz]) state.quiz=QUIZZES[0].id;
state.week=byId[state.quiz].week;
const $ = id => document.getElementById(id);
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function answerBucket(id){return state.answers[id]||(state.answers[id]={});}
function answered(value){return Array.isArray(value)?value.length>0:String(value??'').trim()!==''}
function updateProgress(){const q=byId[state.quiz], bucket=answerBucket(q.id); const done=q.questions.filter(x=>answered(bucket[x.number])).length; $('progress').textContent=`已作答 ${done} / ${q.questions.length}`}
function renderWeeks(){const nav=$('weekNav');nav.replaceChildren();weeks.forEach(week=>{const btn=document.createElement('button');btn.type='button';btn.className='week-button'+(week===state.week?' active':'');const count=QUIZZES.filter(q=>q.week===week).length;btn.innerHTML=`<span>Week ${week}</span><span class="week-count">${count}</span>`;btn.onclick=()=>{state.week=week;state.quiz=QUIZZES.find(q=>q.week===week).id;save();render();window.scrollTo({top:0,behavior:'smooth'})};nav.append(btn)})}
function renderTabs(){const tabs=$('quizTabs');tabs.replaceChildren();QUIZZES.filter(q=>q.week===state.week).forEach(q=>{const btn=document.createElement('button');btn.type='button';btn.className='quiz-tab'+(q.id===state.quiz?' active':'');btn.textContent=q.label;btn.onclick=()=>{state.quiz=q.id;save();render();window.scrollTo({top:0,behavior:'smooth'})};tabs.append(btn)})}
function setChoice(quizId,question,type,index,checked){const bucket=answerBucket(quizId);if(type==='multi'){const current=Array.isArray(bucket[question])?bucket[question]:[];bucket[question]=checked?[...new Set([...current,index])]:current.filter(x=>x!==index)}else bucket[question]=index;save();updateProgress()}
function renderQuestions(){const quiz=byId[state.quiz], bucket=answerBucket(quiz.id), wrap=$('questions');wrap.replaceChildren();quiz.questions.forEach(q=>{const field=document.createElement('fieldset');field.className='question';const legend=document.createElement('legend');legend.innerHTML=`<span class="qnum">Q${q.number}</span>`;const text=document.createElement('span');text.className='qtext';text.textContent=q.question;legend.append(text);field.append(legend);
if(q.type==='input'){const input=document.createElement('input');input.className='text-answer';input.type='text';input.autocomplete='off';input.placeholder='输入你的答案（不会判分）';input.value=bucket[q.number]??'';input.setAttribute('aria-label',`第 ${q.number} 题答案`);input.addEventListener('input',()=>{bucket[q.number]=input.value;save();updateProgress()});field.append(input);const note=document.createElement('small');note.className='input-note';note.textContent='原题为文字或数字输入题';field.append(note)}else{const options=document.createElement('div');options.className='options';const selected=bucket[q.number];q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';const input=document.createElement('input');input.type=q.type==='multi'?'checkbox':'radio';input.name=`${quiz.id}-${q.number}`;input.value=index;input.checked=q.type==='multi'?Array.isArray(selected)&&selected.includes(index):selected===index;input.addEventListener('change',()=>setChoice(quiz.id,q.number,q.type,index,input.checked));const span=document.createElement('span');span.textContent=option;label.append(input,span);options.append(label)});field.append(options)}wrap.append(field)});updateProgress()}
function render(){const quiz=byId[state.quiz];state.week=quiz.week;$('weekLabel').textContent=`Week ${quiz.week}`;$('quizTitle').textContent=`Quiz ${quiz.label}`;$('quizMeta').textContent=`${quiz.topic} · ${quiz.questions.length} questions`;renderWeeks();renderTabs();renderQuestions();const i=QUIZZES.findIndex(q=>q.id===quiz.id);$('prevQuiz').disabled=i===0;$('nextQuiz').disabled=i===QUIZZES.length-1}
function go(delta){const i=QUIZZES.findIndex(q=>q.id===state.quiz),target=QUIZZES[i+delta];if(!target)return;state.quiz=target.id;state.week=target.week;save();render();window.scrollTo({top:0,behavior:'smooth'})}
$('prevQuiz').onclick=()=>go(-1);$('nextQuiz').onclick=()=>go(1);$('clearCurrent').onclick=()=>{state.answers[state.quiz]={};save();renderQuestions()};render();
</script>
